name: Deploy Field Ops 3D

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build playable site
        run: |
          set -e
          mkdir -p site/src
          cp styles.css site/
          cp src/main.js src/constants.js site/src/

          if [ -f src/game.js ] && [ "$(wc -c < src/game.js)" -gt 1000 ]; then
            cp src/game.js site/src/game.js
          elif [ -f src/game.part-a.js ] && [ -f src/game.part-b.js ]; then
            cat src/game.part-a.js src/game.part-b.js > site/src/game.js
          else
            echo "Missing game runtime" >&2
            exit 1
          fi

          cp index.html site/index.html

          grep -q 'three@0.160.0' site/src/game.js
          grep -q 'Field Ops 3D' site/index.html
          test -f site/src/main.js
          wc -c site/src/game.js site/index.html site/styles.css

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
